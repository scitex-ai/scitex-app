name: CLA Assistant

# Thin caller. The body lives ONCE, org-side, in scitex-ai/.github@main.
#
# WHAT THE ORG VERSION ALREADY CARRIES, checked before deleting our fork rather
# than assumed — this repo's local copy existed for these two behaviours and
# both are upstream now:
#
#   owner-bypass   `if: github.event_name == 'push' && github.actor ==
#                  inputs.owner_login` — posts a synthetic CLAssistant=success
#                  status on a direct owner push, so the release pipeline's
#                  sync-main step is not rejected by a branch-protection rule
#                  requiring CLAssistant. Added here by operator direction on
#                  2026-06-04; now an org input.
#   owner_allowlist / owner_login
#                  default to "bot*,ywatanabe1989" and "ywatanabe1989", which
#                  are exactly the values this repo's fork hard-coded. Nothing
#                  is passed below because the defaults already match; passing
#                  them would be restating the default as if it were a choice.
#
# `secrets: inherit` is required, not decorative: the callee declares
# GH_PERSONAL_ACCESS_TOKEN as a REQUIRED secret.
#
# WHY DELEGATING IS A STRICT IMPROVEMENT HERE. Our fork was missing the
# signature-store branch handling that made this check red for three days in
# August 2026 — the action aborts trying to OPEN `cla-signatures` and then
# reports "Committers of pull request N have to sign the CLA", which accuses a
# contributor for what is a missing branch. A local copy does not track fixes
# made org-side; it only looks like it does.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  push:
    branches: [main, develop]
    tags: ['v*']

jobs:
  cla:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    secrets: inherit
