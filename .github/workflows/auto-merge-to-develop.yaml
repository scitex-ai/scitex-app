name: auto-merge-to-develop

# Thin caller. The body lives ONCE, org-side, in scitex-ai/.github@main.
#
# This file used to be a local fork, and the fork was already stale in the way
# PS-231 warns about — except in our favour, which is the interesting part. On
# 2026-08-15 this repo landed #76, "auto-merge counted QUEUED checks as green".
# The org copy carries that same fix, with the same reasoning in its comments:
# a CheckRun that has not finished has `conclusion: null` and no `.state`, so a
# naive `(.conclusion // .state // "")` counts it as passing, and a PR whose
# checks were ALL still queued reported zero pending.
#
# Checked before deleting our copy rather than assuming: the org version is not
# merely equivalent, it already contains our fix. Nothing is lost by delegating.
# A local copy does not track upstream fixes; it only looks like it does.

on:
  check_suite:
    types: [completed]
  workflow_dispatch: {}

jobs:
  auto-merge-to-develop:
    uses: scitex-ai/.github/.github/workflows/auto-merge-to-develop.yml@main
    secrets: inherit
