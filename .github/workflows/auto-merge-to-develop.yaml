name: auto-merge-to-develop
# Merge green PRs that TARGET develop, the moment their checks complete.
# GitHub reads check_suite-triggered workflows from the DEFAULT branch (main),
# so this file lives on main but acts ONLY on PRs whose base is develop.
# codecov + readthedocs checks are ignored (advisory). Fail-safe: if a merge
# is blocked by branch policy the PR simply stays open.
#
# Keep `runs-on: ubuntu-latest`. This job holds `contents: write` and merges on
# its own, so putting it on a persistent self-hosted runner would place a
# long-lived machine — one whose $HOME carries the fleet credential — in the
# path of an automated merge, buying nothing: the job is pure `gh` API calls
# with no build toolchain. Weaker case than cla.yml (check_suite is not
# outsider-triggerable), recorded for the same reason: this note moved here
# 2026-08-11 from a PS-224 exemption that was retired as inert.
on:
  check_suite:
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.check_suite.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: merge green PRs targeting develop
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.check_suite.head_sha }}
        run: |
          set -uo pipefail
          if [ -n "${HEAD_SHA:-}" ]; then
            prs=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '.[] | select(.state=="open") | .number' 2>/dev/null || true)
          else
            prs=$(gh pr list --repo "$REPO" --base develop --state open --json number --jq '.[].number' 2>/dev/null || true)
          fi
          [ -z "${prs:-}" ] && { echo "no open PRs"; exit 0; }
          for pr in $prs; do
            base=$(gh pr view "$pr" --repo "$REPO" --json baseRefName --jq .baseRefName 2>/dev/null || echo "")
            [ "$base" = "develop" ] || { echo "skip #$pr (base=$base, not develop)"; continue; }
            draft=$(gh pr view "$pr" --repo "$REPO" --json isDraft --jq .isDraft 2>/dev/null || echo true)
            [ "$draft" = "true" ] && continue
            # An UNKNOWN check counts as PENDING, never as green. gh reports
            # `conclusion` as an EMPTY STRING (not null, not absent) while a
            # check is QUEUED or IN_PROGRESS, and jq's `//` falls back only on
            # null/false — never on "" — so the old trailing `. != ""` silently
            # discarded exactly the checks meaning "we do not know yet", and a
            # PR pushed shortly before a tick read as fully green. Measured in
            # the fleet: 9 queued checks -> the filter counted 0 pending.
            # This merges with --admin (bypassing branch protection), so the
            # unknown case must fail CLOSED.
            pending=$(gh pr view "$pr" --repo "$REPO" --json statusCheckRollup --jq '
              [ .statusCheckRollup[]
                | select(((.name // .context // "") | ascii_downcase | test("codecov|readthedocs")) | not)
                | (if (.conclusion // "") != "" then .conclusion
                   elif (.state // "") != "" then .state
                   else "PENDING" end)
                | select(. != "SUCCESS" and . != "NEUTRAL" and . != "SKIPPED") ] | length' 2>/dev/null || echo 1)
            if [ "$pending" = "0" ]; then
              gh pr merge "$pr" --repo "$REPO" --merge --admin --delete-branch && echo "MERGED #$pr -> develop" || echo "blocked #$pr"
            else
              echo "PR #$pr not green ($pending) — skip"
            fi
          done
