name: ci

# ============================================================================
# CANONICAL scitex CI — thin org-reusable caller.
#
# Job bodies live ONCE, org-side, in scitex-ai/.github@main. This file carries
# only triggers, concurrency, and thin `uses:` calls, so a fix made org-side
# reaches this repo without anyone copying it here.
#
# WHY THIS FILE EXISTS: scitex-app was running six LOCAL FORKS of workflows the
# org now provides as reusables (PS-231). Measured 2026-08-18, the forks were
# already stale in ways that mattered — the org copy of auto-merge-to-develop
# carries the QUEUED-checks fix this repo landed as #76, and the org copy of
# cla carries the owner-bypass this repo added by operator direction. A local
# copy does not track upstream fixes; it only looks like it does.
#
# WHAT ACTUALLY CONVERTED, AND WHY IT IS ONLY TWO JOBS.
#
# The plan was to convert all six forks and move branch protection onto the
# renamed caller contexts. A throwaway probe branch — legacy files deleted,
# nobody merging it — measured what the callers really do, and killed half of
# it. Both casualties are recorded at their job sites below:
#
#   import-smoke      converts cleanly       (measured green)
#   quality-audit     converts cleanly       (measured green)
#   rtd-sphinx-build  CANNOT convert  -> exit 127, `.[docs]` is a PEP 735 group
#   pytest-matrix     CANNOT convert  -> exit 4,   `.[all,dev]` likewise
#
# cla and auto-merge-to-develop are converted too, in their own files, because
# their triggers do not fit this workflow's `on:`.
#
# THE BRANCH-PROTECTION MANOEUVRE IS THEREFORE CANCELLED, and that is the good
# outcome rather than a reduced one. develop and main require exactly the three
# bare `pytest-matrix-on-ubuntu-py3.*` contexts — the one workflow that cannot
# convert — so the legacy file stays, those contexts keep publishing from it,
# and NO PROTECTION CHANGE IS NEEDED. The only two workflows safe to convert
# turned out to be two nobody protects.
#
# Had the callers been trusted instead of measured, protection would now point
# at three contexts that can never pass here: published, deterministically red,
# forever, every PR blocked, recoverable only by a repo-admin edit.
#
# RUNNER SELECTION: nothing is passed for these two, so each reusable applies
# its own default. Those defaults are GitHub-hosted BY DESIGN — a default must
# fail safe, and a self-hosted default does not: on 2026-08-15 all four
# spartan-cpu runners went offline and every silent caller requested a label no
# online machine served, queueing 57 runs across ~30 repositories with no
# failure reported. Slower is a degradation; never is an outage. Spartan stays
# PREFERRED where it is faster (operator, 2026-08-13) — but preference belongs
# in an explicit `runs_on`, not in a default nobody chose. This repo already
# moved its release pipeline to GitHub-hosted deliberately (#68).
#
# cla.yml and auto-merge-to-develop.yaml DO pass `runs_on` explicitly, because
# for those two the destination carries a security property and must not be
# inherited from a default that can change upstream without review here. The
# reasoning is in those files, next to the thing it constrains.
# ============================================================================

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a protected-branch run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # pytest-matrix IS DELIBERATELY ABSENT — second casualty of the same defect
  # that took out rtd-sphinx-build, and found the same way: by measuring.
  #
  #   pytest-matrix / pytest-matrix-on-ubuntu-py3.11 / .12 / .13   FAILURE
  #   python -m pytest: error: unrecognized arguments: --cov=src/scitex_app
  #                     --cov-report=xml --cov-report=term
  #   ##[error]Process completed with exit code 4
  #
  # The org reusable installs:
  #
  #   uv pip install -e ".[all,dev]" || uv pip install -e ".[dev]" || uv pip install -e .
  #
  # scitex-app declares `all` as an EXTRA but `dev` as a PEP 735 dependency
  # GROUP, and `pytest-cov>=4.0.0` lives in that group. So `.[all,dev]` fails,
  # `.[dev]` fails, and the chain lands on a bare `-e .` that installs no test
  # dependencies at all. pytest-cov is absent, the reusable's own `--cov` flags
  # are then unrecognised, and pytest exits 4.
  #
  # NOTE THE `||` CHAIN, because it is the reason this is not obvious: the
  # install step SUCCEEDS. The failure is degraded silently into a bare install
  # and only surfaces two steps later as an argument-parsing error that says
  # nothing about dependencies. "I could not install the dev group" travels as
  # "installed fine".
  #
  # This is the THIRD instance of one unhandled packaging idiom in this repo:
  #   PS-210      `_extras_index` builds its dev set from
  #               project.optional-dependencies.dev only -> sees an EMPTY dev set
  #   rtd         installs `.[docs]` -> docs is a group -> sphinx missing -> 127
  #   pytest      installs `.[all,dev]` -> dev is a group -> pytest-cov missing -> 4
  # Not three bugs. One idiom the tooling does not know about, surfacing three
  # times, and it will keep recurring as repos adopt the modern spelling.
  #
  # So the legacy pytest-matrix workflow STAYS, PS-231 stays true of it, and
  # branch protection must NOT be moved onto the caller contexts — they can
  # never pass here. Retire this note when the org reusable accepts a
  # dependency_group input.

  import-smoke:
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    secrets: inherit

  quality-audit:
    uses: scitex-ai/.github/.github/workflows/quality-audit.yml@main
    secrets: inherit

  # rtd-sphinx-build IS DELIBERATELY ABSENT. It was in this file for one run and
  # was removed on the measurement, which is what stage B is for.
  #
  #   rtd-sphinx-build / docs-sphinx   FAILURE      <- the org reusable
  #   sphinx                           success      <- our legacy workflow
  #
  #   warning: The package `scitex-app` does not have an extra named `docs`
  #   .venv/bin/sphinx-build: No such file or directory
  #   ##[error]Process completed with exit code 127
  #
  # The org reusable installs `.[docs]` — an EXTRA. This repo declares docs as a
  # PEP 735 DEPENDENCY GROUP under [dependency-groups] (ADR-0005), so `.[docs]`
  # resolves to nothing, sphinx is never installed, and the build dies at 127.
  # Our legacy workflow installs `pip install -e "." --group docs`, which is why
  # it passes. The comment in that file predicted this failure in advance and
  # even predicted it would be MISLEADING — it dies further down, at a missing
  # binary, rather than at the unsatisfied dependency.
  #
  # So this one is not a fork-for-no-reason. It is a real incompatibility with a
  # documented local decision, and converting it would have taken docs from
  # green to permanently red. Two further differences point the same way and are
  # already under analysis fleet-wide (figrecipe + scitex-scholar): the org build
  # is BUILD-ONLY while leaves also vendor docs/sphinx/_build/html into
  # src/<pkg>/_sphinx_html, which SHIPS INSIDE THE WHEEL — so a bare `uses:`
  # would silently freeze the in-wheel documentation with CI green — and leaves
  # run `sphinx-build -W` on pull_request where the org build does not, so
  # converting would also quietly WEAKEN the docs gate.
  #
  # The fix is org-side (a `dependency_group` input, plus the artifact/-W inputs
  # those two are specifying), not thirty individually-reasoned leaf exemptions.
  # Holding this file untouched pending their adversarial pass. PS-231 stays red
  # on rtd-sphinx-build-on-ubuntu-latest.yml until then, and that is correct: the
  # duplication is real, it is just not safe to remove yet.

  # --------------------------------------------------------------------------
  # access-conformance — the REQUIRED non-skipped proof for
  # scitex_app.access_django (hub review item 2 on PR #198).
  #
  # The normal pinned CI (pytest-matrix) installs scitex-dev 0.60.1, which
  # LACKS scitex_dev.access, so test_access_django.py SKIPS there (the guarded
  # import raises ScitexDevAccessMissingError). A skip is not a proof. This job
  # installs scitex-app PLUS the exact scitex-dev commit known to contain the
  # access core (72e8891584d8, scitex-dev develop; access introduced by the
  # merged PR #800), so the conformance battery runs NON-SKIPPED against the
  # real core: assert_equivalent(selector, seeds=range(40)) over a real SQLite
  # queryset filtered by to_q, plus the deterministic fail-closed cases.
  #
  # RETIRE this job when scitex-dev publishes the access release and scitex-app
  # pins it: then the normal pinned CI has the core, the test runs non-skipped
  # there, and this pinned-commit job is redundant.
  # --------------------------------------------------------------------------
  access-conformance:
    name: access-conformance (exact core 72e8891584d8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install scitex-app (all + dev) and the exact access-bearing core
        working-directory: ${{ github.workspace }}
        run: |
          uv venv --python 3.12
          source .venv/bin/activate
          uv pip install -e ".[all]" --group dev 2>/dev/null || uv pip install -e . --group dev
          # Pin the exact scitex-dev commit that carries scitex_dev.access.
          # (Until the access release publishes, 0.60.1 is the latest and lacks it.)
          uv pip install "scitex-dev @ git+https://github.com/scitex-ai/scitex-dev.git@72e8891584d8e3388f6a12a0122f9b1c3fb64ca5"
          # The conformance test must NOT skip: assert the core is importable.
          python -c "import scitex_dev.access as a; assert hasattr(a, 'AccessFilter')"
      - name: Run the FULL exact-core tests/scitex_app (no cross-module errors)
        run: |
          source .venv/bin/activate
          # Hub review 3, item 2: the full suite with the core installed must be
          # green (no failures/errors/collection breaks). In the full run a
          # sibling module (test__app_scope.py) configures Django with
          # DATABASES={} -> dummy backend, so the DB-backed access tests SKIP
          # cleanly (routed through the _db guarded fixture) rather than error.
          # No strict flag here: those skips are expected and correct in the
          # full run. The non-skipped proof is the next step.
          python -m pytest tests/scitex_app -q --no-header -p no:cacheprovider
      - name: Run the access conformance proof (non-skipped, strict)
        env:
          SCITEX_ACCESS_STRICT: "1"
        run: |
          source .venv/bin/activate
          # Isolated to THIS module so its module-top :memory: configure wins
          # (no sibling sets DATABASES={}); every DB-backed case then runs
          # non-skipped. SCITEX_ACCESS_STRICT=1 activates tests/scitex_app/
          # conftest.py's hook that turns ANY skip into a failure, so this
          # authoritative proof cannot pass by skipping a case (core or DB
          # missing).
          python -m pytest tests/scitex_app/test_access_django.py -v --no-header -p no:cacheprovider
