name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

jobs:
  test:
    name: pytest-matrix-on-ubuntu-py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          # pip>=25.1 is REQUIRED, not preferred: `--group` is how the dev
          # toolchain is requested now that dev is a PEP 735 group, and an
          # older pip rejects the flag outright (loudly, which is correct).
          python -m pip install --upgrade pip
          # `[all]` is the runtime extra; `--group dev` is the toolchain.
          # NO `||` fallback chain here, deliberately. The old chain started
          # with `.[all,dev]`, and once dev stopped being an extra pip would
          # have WARNED about the unknown extra and still exited 0 -- so the
          # fallback could never fire and the leg would run with no pytest
          # plugins while looking installed. A gate that cannot fail is not a
          # gate; if this install breaks, the job must go red.
          pip install -e ".[all]" --group dev
      - name: Run tests
        run: |
          pytest tests/ --cov=src/scitex_app --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        if: always() && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  # ── the reference example ───────────────────────────────────────────────────
  #
  # A SEPARATE JOB, NOT A STEP IN THE MATRIX ABOVE, and the separation is the
  # design rather than tidiness.
  #
  # This example is the only executable statement of the stx-mount contract --
  # "one build serves correctly at two different mounts" -- and it is what app
  # authors are pointed at. Its tests existed, passed, and had NEVER RUN IN CI:
  # `testpaths = ["tests"]` and the example lives under `examples/`, so nothing
  # collected them. A suite nobody runs is indistinguishable from one that does
  # not exist, except that it looks like coverage.
  #
  # WHY NOT ADD IT TO THE MATRIX ABOVE. The example needs `scitex-ui` for its
  # shell template, and those three matrix contexts are the ONLY ones branch
  # protection requires. Installing scitex-ui there would put a package no
  # other test needs into the three legs that gate every pull request -- so a
  # scitex-ui problem would block all merging in this repo for a reason having
  # nothing to do with the change under review. Here, the same problem reddens
  # one clearly-named job and nothing else.
  #
  # THIS IS A RECORD, NOT A GATE, AND SAYING SO IS THE POINT. `example` is not
  # in branch protection's required contexts, so a failure here does not block
  # a merge -- it is visible on the pull request and nowhere else. Promoting it
  # to a gate is a deliberate second step (card
  # app-arm-the-example-leg-once-it-has-a-track-record), taken after it has run
  # green for a while, because a brand-new required context that flakes blocks
  # every PR in the repo and only a repo-admin edit gets you out.
  #
  # MEASURED BEFORE WIRING, because a leg that cannot fail is worse than none:
  #   mount_prefix() forced to return "" (_django.py)
  #     -> 1 failed, 5 passed, failing on the EMBEDDED-mount arm specifically
  #   restored -> 6 passed
  # So this job detects a regression in the SDK function the example depends
  # on, rather than merely re-testing the example's own template.
  example:
    name: reference-example-mounts-anywhere
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # scitex-ui is NOT a dependency of scitex-app and must not become
          # one: it is the UI package, and scitex-app's CLI and MCP surfaces
          # are required to stay headless. It is installed HERE, for this job
          # only, because the example extends scitex_ui's shell template.
          pip install -e ".[all]" --group dev
          pip install scitex-ui
      - name: Run the example's own tests
        run: |
          # No PYTHONPATH or working-directory needed: the example ships a
          # conftest.py that puts its own root on sys.path, so it runs the
          # same way here, from the repo root, and from inside its folder.
          pytest examples/hello_world_app/tests -q

      - name: Run the cross-package agreement checks
        run: |
          # THESE RAN NOWHERE UNTIL 2026-09-03, and both files claimed in their
          # own docstrings that they ran here. Measured on PR #121:
          #     test__django_marker_agreement.py   .ss......
          #     test_authz_kinds_agreement.py      ..s.....
          # The matrix job installs no scitex-ui, so every cross-package arm
          # SKIPPED there; and this job -- the only one that installs it -- ran
          # only the example's own tests. A skipped test and a passing test look
          # identical in a summary line, which is how that survived a week.
          #
          # Kept in THIS job on purpose rather than moved into the matrix:
          # scitex-app must not gain a dependency on scitex-ui, and this job is
          # deliberately not a required context, so these stay a RECORD.
          pytest tests/scitex_app/test__django_marker_agreement.py \
                 tests/scitex_app/test_authz_kinds_agreement.py -q
