name: release

# Tag-driven release pipeline — GITHUB-HOSTED (ubuntu-latest).
#
# The intended operator flow is:
#
#     git tag vX.Y.Z && git push origin vX.Y.Z
#
# Everything else fires automatically:
#
#   1. test          — matrix pytest. Must pass or the pipeline halts; nothing
#                      is published until tests are green on the tagged commit.
#   2. build         — wheel + sdist, uploaded as artifact.
#   3. publish       — PyPI via trusted publishing (pypa/gh-action-pypi-publish).
#   4. release       — GitHub Release with CHANGELOG notes + artifacts.
#
# develop→main promotion is a DELIBERATE, separate PR (operator policy);
# this pipeline never auto-syncs main.
#
# WHY GITHUB-HOSTED (2026-08-09): the operator ruled on 2026-08-05
# 「スパルタンのCIは全面的にやめましょう」 — stop Spartan CI entirely. Spartan's
# scheduler queues jobs behind other work, and this is the SHIPPING path, so a
# queued runner delays a release rather than just a PR check. This repo is
# public, so GitHub-hosted minutes are free.
#
# WHAT THIS REPLACED, and why the old rationale no longer holds. The pipeline
# previously ran every job inside the scitex-ci Apptainer SIF on a Spartan
# compute node, because those nodes have no Python on the bare runner (so
# actions/setup-python failed "version not found for this OS") and no Docker
# (so pypa/gh-action-pypi-publish, a Docker action, could not run — hence a
# hand-rolled OIDC JWT → PyPI mint-token → twine upload in
# .github/ci/publish-in-sif.sh). Neither constraint applies on ubuntu-latest:
# setup-python works, and the standard publish action replaces the manual mint
# entirely. The SIF's own justification cited the pytest matrix as precedent —
# and that matrix (pytest-matrix-on-ubuntu-py3-11-3-12-3-13.yml) already runs
# on ubuntu-latest, so the precedent now points the other way.
#
# TRUSTED PUBLISHING IS UNCHANGED AND MUST STAY THAT WAY: PyPI matches on
# (repository, workflow FILENAME, environment name). This file keeps its name
# and the publish job keeps `environment: pypi`, so the existing PyPI trust
# configuration continues to match. Renaming either would break publishing at
# the point of no return — after the tag is pushed.
#
# The test/build steps mirror pytest-matrix-on-ubuntu-py3-11-3-12-3-13.yml
# deliberately, including its pip>=25.1 + `--group dev` install with NO `||`
# fallback chain: dev is a PEP 735 group, not an extra, and a chain starting
# at `.[all,dev]` would make pip WARN about an unknown extra and still exit 0,
# so the leg would run with no pytest plugins while looking installed. A gate
# that cannot fail is not a gate.
#
# Manual re-run: the workflow also accepts a `version` input via
# workflow_dispatch so you can re-publish without re-tagging.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish (e.g. v0.10.19) — must already exist on the repo'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          # pip>=25.1 is REQUIRED, not preferred: `--group` is how the dev
          # toolchain is requested now that dev is a PEP 735 group, and an
          # older pip rejects the flag outright (loudly, which is correct).
          python -m pip install --upgrade pip
          # `[all]` is the runtime extra; `--group dev` is the toolchain.
          # No `||` fallback chain, deliberately — see the header.
          pip install -e ".[all]" --group dev
      - name: Run tests
        run: |
          pytest tests/ --cov=src/scitex_app --cov-report=xml --cov-report=term

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.version }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
          # fail-loud: an empty dist/ must stop the pipeline here, not surface
          # later as a confusing publish or an empty GitHub Release.
          ls -1 dist/*.whl dist/*.tar.gz >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scitex-app
    # id-token: write is what lets the publish action exchange a GitHub OIDC
    # token for a short-lived PyPI token. Keep it.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          VERSION="${VERSION#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {p=1; next}
            p && /^## \[/ {exit}
            p
          ' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then
            echo "Release v${VERSION}. See CHANGELOG.md for details." > release-notes.md
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.build.outputs.version }}" \
            --title "${{ needs.build.outputs.version }}" \
            --notes-file release-notes.md \
            dist/*
