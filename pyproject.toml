[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-app"
version = "0.2.8"
description = "SciTeX App SDK — write-once interface for local + cloud apps"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [{name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"}]
keywords = ["scitex", "app-sdk", "files", "storage", "cloud", "local"]

# click + rich are runtime deps for the canonical CLI surface
# (scripts entry-point `scitex-app = "scitex_app._cli:main"` imports
# them at module top). Importing scitex_app._cli without them blew
# up CI when the [dev,cli] extra-install hit a resolver fallback.
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
chat = [
    "anthropic>=0.25.0",
]
chat-all = [
    "anthropic>=0.25.0",
    "litellm>=1.0.0",
]
cli = [
    # click + rich are now in base `dependencies`; this extra is a
    # backwards-compat alias so `pip install scitex-app[cli]` keeps
    # working.
]
cloud = [
    "requests>=2.28.0",
]
django = [
    "django>=4.2",
]
mcp = [
    "fastmcp>=2.0.0",
]
dev = [
    "anthropic>=0.25.0",
    "click>=8.0.0",
    # django>=4.2 — required by tests/scitex_app/_chat/migrations/test_0001_initial.py
    "django>=4.2",
    # fastmcp>=2.0.0 — required by tests/scitex_app/_mcp/test_server.py
    "fastmcp>=2.0.0",
    "litellm>=1.0.0",
    "pytest-cov>=4.0.0",
    "pytest>=7.0.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "scitex-dev>=0.11.7",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-app[chat]",
    "scitex-app[chat-all]",
    "scitex-app[cli]",
    "scitex-app[cloud]",
    "scitex-app[django]",
    "scitex-app[mcp]",
]

[project.scripts]
scitex-app = "scitex_app._cli:main"

[project.entry-points."scitex_dev.docs"]
scitex-app = "scitex_app"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-app"
Repository = "https://github.com/ywatanabe1989/scitex-app"
Documentation = "https://scitex-app.readthedocs.io/"

[project.entry-points."scitex_dev.skills"]
scitex-app = "scitex_app"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
parallel = true
source = ["scitex_app"]
concurrency = ["multiprocessing", "thread"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]

[tool.scitex_dev.audit]
# PS-168 — Per-package secret + env-var prefix in GitHub Actions workflows.
# `GH_PERSONAL_ACCESS_TOKEN` is the ecosystem-wide cross-cutting PAT used
# by the contributor-assistant CLA action. The natural GITHUB_* namespace
# is reserved by GitHub Actions on the secret-name surface (HTTP 422 on
# every `gh secret set`), so the GH_ shorthand is the canonical
# substitute and is registered ecosystem-wide via PR #122 on scitex-dev
# (EXCEPTION_SECRETS_DEFAULT). This per-package entry pins the same
# exception inline so the audit passes on every scitex-dev version,
# independent of release timing.
ps168_secret_exceptions = ["GH_PERSONAL_ACCESS_TOKEN"]

dependencies = [
    "scitex-dev>=0.17.8",
]
