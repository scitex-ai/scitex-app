[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-app"
version = "0.2.8"
description = "SciTeX App SDK — write-once interface for local + cloud apps"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [{name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"}]
keywords = ["scitex", "app-sdk", "files", "storage", "cloud", "local"]

# click + rich are runtime deps for the canonical CLI surface
# (scripts entry-point `scitex-app = "scitex_app._cli:main"` imports
# them at module top). Importing scitex_app._cli without them blew
# up CI when the [dev,cli] extra-install hit a resolver fallback.
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
chat = [
    "anthropic>=0.25.0",
]
chat-all = [
    "anthropic>=0.25.0",
    "litellm>=1.0.0",
]
cli = [
    # click + rich are now in base `dependencies`; this extra is a
    # backwards-compat alias so `pip install scitex-app[cli]` keeps
    # working.
]
cloud = [
    "requests>=2.28.0",
]
django = [
    "django>=4.2",
]
mcp = [
    "fastmcp>=2.0.0",
]
dev = [
    "anthropic>=0.25.0",
    "click>=8.0.0",
    # django>=4.2 — required by tests/scitex_app/_chat/migrations/test_0001_initial.py
    "django>=4.2",
    # fastmcp>=2.0.0 — required by tests/scitex_app/_mcp/test_server.py
    "fastmcp>=2.0.0",
    "litellm>=1.0.0",
    "pytest-cov>=4.0.0",
    "pytest>=7.0.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "scitex-dev>=0.11.7",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-app[chat]",
    "scitex-app[chat-all]",
    "scitex-app[cli]",
    "scitex-app[cloud]",
    "scitex-app[django]",
    "scitex-app[mcp]",
]

[project.scripts]
scitex-app = "scitex_app._cli:main"

[project.entry-points."scitex_dev.docs"]
scitex-app = "scitex_app"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-app"
Repository = "https://github.com/ywatanabe1989/scitex-app"
Documentation = "https://scitex-app.readthedocs.io/"

[project.entry-points."scitex_dev.skills"]
scitex-app = "scitex_app"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (pip-install/venv-build gates; deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
parallel = true
source = ["scitex_app"]
concurrency = ["multiprocessing", "thread"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]
