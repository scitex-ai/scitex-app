[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-app"
version = "0.5.0"
description = "SciTeX App SDK — write-once interface for local + cloud apps"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [{name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"}]
keywords = ["scitex", "app-sdk", "files", "storage", "cloud", "local"]

# click + rich are runtime deps for the canonical CLI surface
# (scripts entry-point `scitex-app = "scitex_app._cli:main"` imports
# them at module top). Importing scitex_app._cli without them blew
# up CI when the extra-install hit a resolver fallback.
# scitex-config's local_state.runtime_path() is what _gui_runtime.py
# uses to resolve the fleet-standard runtime-state-db path
# (<proj-root>/.scitex/<pkg-short>/runtime/...) for the shared GUI
# launcher's state file -- needed unconditionally, not just under [dev].
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "scitex-config>=0.3.6",
]

[project.optional-dependencies]
# Extras are all-or-nothing (operator directive, 2026-07-13): one [all]
# extra, no fine-grained menu. A fine-grained extra that goes empty
# silently (e.g. the former `cli = []` after click/rich moved to base
# `dependencies`) turns an install-this-extra hint into a no-op that
# looks like a fix but installs nothing -- worse than no hint, since the
# user believes they already tried it (scitex-writer PR #322 incident).
# `dev`/`docs` stay separate: those are for BUILDING the package, not
# using it.
all = [
    "anthropic>=0.25.0",
    "litellm>=1.0.0",
    "requests>=2.28.0",
    "django>=4.2",
    "fastmcp>=2.0.0",
]

# ADR-0005: dev and docs are DEPENDENCY GROUPS, not extras.
#
# Operator decision 2026-08-02 (scitex-dev PR #490): a public install extra is
# `[all]` or bare only; development tooling moves to PEP 735 groups.
#
# WHY GROUPS RATHER THAN JUST DROPPING dev/docs FROM `all`: scitex-dev's shipped
# rule PS-221 requires every PUBLIC extra to be a subset of `all`, which is the
# opposite of the new rule. Both are correct on their own terms and
# irreconcilable ONLY because dev/docs were public extras -- development tooling
# exposed through a mechanism designed for user-facing optional features. Groups
# are not [project.optional-dependencies], so PS-221 never sees them and keeps
# full force over everything it was written for. The rule needs no amendment.
#
# This repo's `all` already carried the right INTENT in a comment --
# "dev/docs stay separate: those are for BUILDING the package, not using it" --
# and PS-221 failed it anyway. The comment was right and the mechanism could not
# express it. PEP 735 is the mechanism that can.
#
# Install with `uv pip install -e . --group dev` (uv >= 0.6, pip >= 25.1).
# `.[dev]` no longer resolves and only WARNS, so any CI that used it must move
# in lockstep or it silently installs no toolchain.
[dependency-groups]
dev = [
    "anthropic>=0.25.0",
    "click>=8.0.0",
    # django>=4.2 — required by tests/scitex_app/_chat/migrations/test_0001_initial.py
    "django>=4.2",
    # fastmcp>=2.0.0 — required by tests/scitex_app/_mcp/test_server.py
    "fastmcp>=2.0.0",
    "litellm>=1.0.0",
    "pytest-cov>=4.0.0",
    "pytest>=7.0.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "scitex-dev>=0.11.7",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]

[project.scripts]
scitex-app = "scitex_app._cli:main"

[project.entry-points."scitex_dev.docs"]
scitex-app = "scitex_app"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-app"
Repository = "https://github.com/ywatanabe1989/scitex-app"
Documentation = "https://scitex-app.readthedocs.io/"

[project.entry-points."scitex_dev.skills"]
scitex-app = "scitex_app"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (pip-install/venv-build gates; deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
parallel = true
source = ["scitex_app"]
concurrency = ["multiprocessing", "thread"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]

[tool.scitex_dev]
# §6 MCP-tool <-> Python-API parity exemption (scitex-dev
# _mcp_parity.py). scitex-app's public surface is a mix: agent-actionable
# file/app-ops functions already have full MCP mirrors (app_read_file,
# app_scaffold, app_validate, ...), but scitex_app.embed exposes Django
# HOST-INTEGRATION primitives (run_standalone, scitex_api_dispatch,
# scitex_editor_page, scitex_urlpatterns) that are structurally not
# MCP-tool-shaped: run_standalone blocks forever running a dev webserver
# (would hang an MCP call), and the other three are wiring-time factory
# functions returning non-JSON-serializable callables, used at
# urls.py/views.py import time — not agent-invocable actions. This is the
# same false-positive shape §6 already exempts for classes (see
# _mcp_parity.py docstring); functions used purely as framework
# integration points hit the same false positive. Package-level exemption
# because these primitives are threaded through scitex_app.embed by
# design, not a one-off oversight.
mcp_parity_exempt = true

[tool.scitex_dev.audit]
# PS-168 — Per-package secret + env-var prefix in GitHub Actions workflows.
# `GH_PERSONAL_ACCESS_TOKEN` is the ecosystem-wide cross-cutting PAT used
# by the contributor-assistant CLA action. The natural GITHUB_* namespace
# is reserved by GitHub Actions on the secret-name surface (HTTP 422 on
# every `gh secret set`), so the GH_ shorthand is the canonical
# substitute and is registered ecosystem-wide via PR #122 on scitex-dev
# (EXCEPTION_SECRETS_DEFAULT). This per-package entry pins the same
# exception inline so the audit passes on every scitex-dev version,
# independent of release timing.
ps168_secret_exceptions = ["GH_PERSONAL_ACCESS_TOKEN"]
