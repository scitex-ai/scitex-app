# scitex-dev audit configuration for scitex-app.
#
# EXEMPTIONS ARE PER-RULE, PER-JOB, EACH WITH A WRITTEN REASON — never a blanket
# flag. The constitution is explicit about why (§2): a gate configured so it is
# always green is the same as deleting it, except worse, because the config
# still lists it and everyone believes it is working. Measured 2026-07-19: a
# quality gate run with `--new-only --no-version-check` reported green in 27
# seconds while the identical command by hand reported 1817 violations.
#
# So every entry below names ONE job and says why THAT job cannot move. Each is
# individually greppable and individually revisitable, and a reader can disagree
# with any one of them without re-litigating the rest.

audit:
  exemptions:
    PS-224:
      # ----------------------------------------------------------------------
      # THE RULE AND THE CONSTITUTION DISAGREE, and this is not a case of the
      # repo being behind.
      #
      # PS-224 enforces a no-hosted-runners directive. The constitution §4 now
      # says the opposite, in terms:
      #
      #   "CI defaults to GitHub-hosted runners. Most of our repositories are
      #    public, so hosted minutes are free — the cost objection that once
      #    justified self-hosting mostly does not apply. Prefer the boring,
      #    managed option first."
      #
      # and goes further, naming the cost of the alternative: four differently
      # named self-hosted runners sharing one ~/.runner-toolcache produced seven
      # failures across five pull requests in one afternoon, every one cleared
      # by a plain rerun.
      #
      # So these jobs are on ubuntu-latest BY POLICY, not by neglect. Raised
      # with scitex-dev, who own the rule; exempted here with the citation
      # rather than silently, so that if the rule wins the argument these
      # entries are exactly what gets reverted.
      # ----------------------------------------------------------------------
      - path: .github/workflows/pytest-matrix-on-ubuntu-py3-11-3-12-3-13.yml::test
        line: 0
        reason: >-
          Public repo, hosted minutes are free, and the constitution §4 makes
          GitHub-hosted the default for exactly this kind of short matrix job.
          Moving a 3-version pytest matrix onto the shared Spartan runner buys
          nothing and inherits the tool-cache collision class measured on
          scitex-cards 2026-07-31.
      - path: .github/workflows/quality-audit-on-ubuntu-latest.yml::audit
        line: 0
        reason: >-
          Same as the pytest matrix, and with an added reason: this job RUNS the
          audit. Putting the auditor on a machine whose state can rot is how a
          gate starts reporting on its own environment rather than on the code.
      - path: .github/workflows/import-smoke-on-ubuntu-py3-12.yml::install-check
        line: 0
        reason: >-
          An import smoke test must run on a CLEAN machine to mean anything. A
          persistent self-hosted runner carries leftover site-packages from
          previous jobs, which is precisely the state that would make a missing
          dependency pass.
      - path: .github/workflows/newb-docs-quality-on-ubuntu-latest.yml::newb
        line: 0
        reason: >-
          Docs-quality lint, seconds of CPU, no GPU and no large data. The
          constitution's criterion for self-hosting is developer speed, and this
          job is not slow anywhere.
      - path: .github/workflows/rtd-sphinx-build-on-ubuntu-latest.yml::sphinx
        line: 0
        reason: >-
          Mirrors what Read the Docs itself runs, on a hosted image. Building it
          somewhere else would test a different environment than the one that
          publishes.
      - path: .github/workflows/auto-merge-to-develop.yaml::automerge
        line: 0
        reason: >-
          Holds merge authority over develop. Ephemeral hosted VM is the correct
          isolation for a job that can write to the default branch; a persistent
          self-hosted box would keep that capability resident on a machine that
          serves every other repo's CI.
      # ----------------------------------------------------------------------
      # The two below are a DIFFERENT and stronger case. PS-224's own message
      # says, verbatim, "DO NOT RE-POINT THIS JOB". Both are attacker-triggerable
      # (issue_comment, pull_request_target) and carry secrets; those events run
      # against the BASE repo with its secrets and need no write access to start,
      # so an ephemeral hosted VM is the correct isolation and a compromise costs
      # one disposable runner. The rule tells you to escalate rather than silence
      # — this IS the escalation, recorded where the next reader will find it.
      # ----------------------------------------------------------------------
      - path: .github/workflows/cla.yml::CLAssistant
        line: 0
        reason: >-
          PS-224's own text forbids re-pointing this job. Attacker-triggerable
          (issue_comment, pull_request_target) and carries
          GH_PERSONAL_ACCESS_TOKEN plus GITHUB_TOKEN. Moving it self-hosted would
          put attacker-triggerable code on the machine that stores the
          credential. Hosted is the deliberate, safer choice.
      - path: .github/workflows/cla.yml::owner-bypass
        line: 0
        reason: >-
          Same trigger surface and the same explicit instruction in PS-224's
          message. Carries GITHUB_TOKEN. Hosted by design.
