# scitex-dev project-type config
# Drives which rule families the auditor applies.
# See: scitex-dev ecosystem audit-project --help
#
# Deliberately does NOT set `project-type:`. The auditor already infers it
# correctly here (it produces a complete, correct finding set without this
# file), and pinning it would change which rule FAMILIES run — a change that
# can silently drop rules. This file adds exemptions only.

audit:
  # PS-210 §2 (dev-extras-incomplete) — a rule-level skip, which is the
  # BLUNTEST mechanism available and is used only because PS-210 supports
  # nothing finer: `exemption_for()` is consulted by exactly four checks
  # (config-layout, no-print, runner-destinations, logs-path), and PS-210 is
  # not one of them. A per-site `exemptions:` entry for it would sit in this
  # file looking handled while suppressing nothing, and a dead exemption is
  # worse than none — so it is not written.
  #
  # WHY IT FIRES (read from the implementation, not from its message):
  # `_check_dev_extras_complete.py::_extras_index` builds its `dev` set from
  # `project.optional-dependencies.dev` ONLY. dev is a PEP 735 group here, so
  # that table is absent, the rule sees an EMPTY dev set, and it reports every
  # `[all]` member as missing from it. The rule is not group-aware.
  #
  # Its message ("tests import it unguarded") does not describe this repo:
  # tests/ contains no reference to anthropic, litellm or requests. It reached
  # us via its TRANSITIVE branch instead — dep imported in src/, tests import
  # scitex_app. That branch is sound; only the dev-set lookup is wrong.
  #
  # COMPENSATING CONTROL, so this is not a gate merely switched off: the
  # property PS-210 protects is "a fresh dev install can collect and run the
  # suite". The pytest matrix installs exactly that
  # (`pip install -e ".[all]" --group dev`) and runs the full suite on
  # 3.11/3.12/3.13 with no `||` fallback, so a dev dep that goes missing fails
  # collection loudly on three legs. That is stronger than the heuristic being
  # skipped, because it EXECUTES the install rather than modelling it.
  #
  # REMOVE THIS SKIP once PS-210 reads `[dependency-groups]`. Reported as
  # scitex-dev#496 (rule gap) and scitex-dev#497 (the summary's masking
  # accounting, found while verifying this skip). CI installs scitex-dev from
  # PyPI, so the fix arrives without a change here. A bridge, not a standing
  # exception.
  skip:
    - PS-210

  # NO `exemptions:` BLOCK — deliberately, and this note is why.
  #
  # Until 2026-08-11 this file carried 8 PS-224 (runner-destination-unregistered)
  # exemptions, each with a written reason. They are gone because they were
  # MEASURED INERT, not because the reasoning was abandoned.
  #
  # Two-arm, on the version that actually gates the merge:
  #   scitex-dev v0.47.0, exemptions present   -> 0 unmasked errors, 41 lines
  #   scitex-dev v0.47.0, exemptions REMOVED   -> 0 unmasked errors, 41 lines
  # Identical. PS-224 raises nothing here on v0.47.0, so the entries suppressed
  # nothing and only looked like they did.
  #
  # WHY THE LOCAL RUN WAS NOT ENOUGH: this agent's venv has v0.43.1, four minor
  # versions behind CI. The local two-arm agreed, but agreeing for the wrong
  # reason is not evidence — arm B was re-run on a throwaway branch through the
  # `quality` workflow so the measurement came from v0.47.0 itself. On 2026-08-05
  # the same two-arm on v0.42.0 gave 0 vs 8, which is why these entries existed
  # and why scitex-dev's advice to delete them was refused then. The rule was
  # re-premised in between (scitex-dev#498).
  #
  # A DEAD EXEMPTION IS WORSE THAN NONE — the same principle already applied to
  # PS-210 below. It reads as handled, and worse, it would MASK a genuine future
  # finding: if someone later re-points one of these jobs at a self-hosted label,
  # PS-224 under its new premise should fire, and a stale entry naming that file
  # could swallow it.
  #
  # THE SECURITY REASONING WAS NOT DELETED, IT WAS RELOCATED. Entries 7-8
  # (cla.yml, auto-merge-to-develop) never rested on the runner-speed premise —
  # they recorded that an outsider-triggerable job carrying
  # GH_PERSONAL_ACCESS_TOKEN must not land on a persistent runner whose $HOME
  # holds the live fleet credential. That now lives as a comment in each of those
  # two workflow files, where someone editing `runs-on` will actually see it.
  # PS-224's own message says "DO NOT RE-POINT THIS JOB ... Resolving this needs
  # a decision, not a re-point"; the decision is still recorded, just somewhere a
  # reader of the workflow cannot miss it.
  #
  # IF PS-224 STARTS FIRING AGAIN, do not reflexively re-add exemptions: re-read
  # its message first, because it fired here originally from a premise
  # ("the no-hosted-runners directive") that the operator had already dropped.

  # The note above said "NO `exemptions:` BLOCK". That stopped being true on
  # 2026-08-18. The note is KEPT rather than rewritten, because the standard it
  # sets — measured, per-site, retired when inert — is the standard the entry
  # below has to meet.
  #
  # SHAPE MATTERS HERE AND IS EASY TO GET WRONG THREE WAYS, all silent-ish:
  #   1. In pyproject.toml instead of this file      — ignored, no error
  #   2. A LIST at the block level (`- rule: PS-231`) — rejected wholesale
  #   3. The argument written as YAML COMMENTS       — `reason` is MANDATORY,
  #      and comments are not parsed, so the entry is rejected as empty
  # `parse_exemptions` wants a MAPPING of rule-code -> [entries], each with a
  # non-empty `reason`. Verified against the installed parser source, not
  # inferred; figrecipe caught (2) and (3) in a draft of this entry.
  exemptions:
    PS-231:
      - path: .github/workflows/rtd-sphinx-build-on-ubuntu-latest.yml
        line: 0
        reason: >-
          TIME-BOXED — delete when the org reusable accepts the inputs named
          below. Tracked on
          dev-corpus-release-turned-15-repos-red-and-notified-none-of-them-20260818.
          Fleet ruling by scitex-hub 2026-08-18; wording converged with
          figrecipe and scitex-scholar so three repos point at ONE upstream gap
          instead of describing three problems.

          THE DUPLICATION IS REAL AND THE RULE IS RIGHT. This file genuinely
          re-implements the org reusable. It is exempted because the SANCTIONED
          FIX IS MEASURED TO BREAK THIS REPO — not because converting is work,
          and not because the finding is wrong. Of the six PS-231 findings here,
          five are being FIXED by converting to callers in ci.yml; this is the
          one that cannot be, and it is the only entry in this block.

          MEASURED HERE, PR #78, 2026-08-18 — caller and legacy running side by
          side in ONE run, which is what makes it a comparison rather than an
          anecdote: "rtd-sphinx-build / docs-sphinx" FAILURE while "sphinx"
          SUCCESS. Log: 'warning: The package `scitex-app` does not have an
          extra named `docs`' then '.venv/bin/sphinx-build: No such file or
          directory' then 'exit code 127'.

          MECHANISM 1 — MEASURED HERE. The org reusable installs `.[docs]`, an
          EXTRA. This repo declares docs as a PEP 735 dependency GROUP under
          [dependency-groups] per ADR-0005, so the extra resolves to nothing,
          sphinx is never installed, and the job dies at 127 on a missing binary
          rather than at the unsatisfied dependency. Our legacy file uses `pip
          install -e "." --group docs`, which is why it is green. CONFIRMED NOT
          TO APPLY to scitex-scholar or figrecipe, both of which declare docs as
          a classic extra — this mechanism is scitex-app-specific, and saying so
          is the point: an exemption is a claim about THIS repo.

          MECHANISM 2 — REPORTED BY figrecipe AND scitex-scholar; NOT
          independently reproduced here. The org build is BUILD-ONLY, while
          leaves also vendor docs/sphinx/_build/html into src/<pkg>/_sphinx_html;
          hatch packages src/<pkg> wholesale, so that bundle SHIPS INSIDE THE
          WHEEL. Converting would freeze the shipped documentation with CI green
          and nothing anywhere saying so.

          MECHANISM 3 — REPORTED BY figrecipe AND scitex-scholar; NOT
          independently reproduced here. Leaves run `sphinx-build -W` on
          pull_request; the org build does not. Converting would silently WEAKEN
          the docs gate.

          SMALLEST SUFFICIENT ORG-SIDE FIX, so this is a burn-down item and not
          a standing exception: dependency_group (mechanism 1), fail_on_warning
          or a general sphinx_opts (3), python_version, upload_artifact plus an
          artifact-name output so each caller vendors and commits in its own job
          with its own contents:write (2), and fork_guard. ONE org change retires
          this entry across roughly thirty repositories. Thirty individually
          reasoned exemptions for one missing input is how an exemption list
          becomes permanent.

          DO NOT convert this file to a caller before those inputs exist, and
          note the failure is NOT a red PR you can retry. Under branch protection
          the required context would point at a publisher that CANNOT succeed —
          deterministically red forever, every PR blocked behind it. That is
          worse than the "required context nobody publishes" deadlock, because
          the context IS published and therefore looks alive.

          WHY THIS IS NOT A GATE SWITCHED OFF. The property PS-231 protects is
          "this repo tracks upstream fixes to shared workflows". This entry is
          scoped to ONE rule and ONE path, so every other workflow here is still
          checked — and five of them are being converted in the same change
          rather than exempted. The finding is recorded as TRUE and pointed
          upstream, which is the opposite of suppressing it.

